services:
   mysql-db:
      image: mysql:8.0
      container_name: mysql_dbInventario
      restart: always

   environment:
    MYSQL_ROOT_PASSWORD: Rootroot
    MYSQL_DATABASE: DB_Inv
    MYSQL_USER: Admin
    MYSQL_PASSWORD: AdminPassword

    ports:
     - "5506:3306"
 
    volumes:
    - mysql_data>/var/lib/mysql
      

volumes:
  mysql_data: